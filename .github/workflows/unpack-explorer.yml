name: Materialize Explorer Package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract packaged Explorer
        shell: bash
        run: |
          set -euo pipefail
          test -f uae-ecosystem-full-explorer.zip
          rm -rf /tmp/explorer-package
          mkdir -p /tmp/explorer-package
          unzip -q -o uae-ecosystem-full-explorer.zip -d /tmp/explorer-package

          if [ -f /tmp/explorer-package/uae-ecosystem-full-explorer/index.html ]; then
            cp -R /tmp/explorer-package/uae-ecosystem-full-explorer/. ./
          else
            INDEX_PATH=$(find /tmp/explorer-package -type f -name index.html -print -quit)
            if [ -z "${INDEX_PATH}" ]; then
              echo "No index.html found in package" >&2
              exit 1
            fi
            ROOT_DIR=$(dirname "${INDEX_PATH}")
            cp -R "${ROOT_DIR}/." ./
          fi

          rm -f uae-ecosystem-full-explorer.zip

      - name: Verify expected structure
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f README.md
          test -f docs/redesign-corrections-report.md
          echo "Explorer package materialized successfully."

      - name: Commit materialized Explorer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: materialize GitHub-ready Explorer package"
          git push
